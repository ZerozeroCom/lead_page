<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/register/favicon.ico">
  <title id="pageTitle"></title>
  <link href="/register/main.css" rel="stylesheet">
  <script src="/register/init.js"></script>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loadingOverlay" class="overlay loading" aria-hidden="true" role="status">
    <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="none" stroke="rgba(35,74,143,.25)" stroke-width="4" />
      <path d="M22 12a10 10 0 0 1-10 10" fill="none" stroke="#234a8f" stroke-width="4" stroke-linecap="round" />
    </svg>
    <div>
      <div id="processingTitle" style="font-size:18px;font-weight:700;"></div>
      <div id="processingHint" style="margin-top:6px;font-size:13px;color:var(--muted-foreground);"></div>
    </div>
  </div>

  <div class="container">
    <header id="headerTitle" class="payment-header"></header>
  </div>

  <main class="container">
    <!-- Payment info -->
    <section class="card section">
      <div class="row">
        <div class="payment-info-left">
          <div class="icon-badge" aria-hidden="true">
            <!-- Credit card icon -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 8.5H21.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M4.5 6.5H19.5C20.6046 6.5 21.5 7.39543 21.5 8.5V17.5C21.5 18.6046 20.6046 19.5 19.5 19.5H4.5C3.39543 19.5 2.5 18.6046 2.5 17.5V8.5C2.5 7.39543 3.39543 6.5 4.5 6.5Z" stroke="white" stroke-width="2"/>
              <path d="M6.5 15.5H10.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h2 id="paymentInfo-title" class="title"></h2>
            <p id="paymentInfo-subtitle" class="subtitle"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- Notice section -->
    <section class="card section notice" style="padding-top: 12px; padding-bottom: 12px;">
      <p id="head-notice1" class="warning"></p>
      <p id="head-notice2" class="info"></p>
      <p id="head-notice3" class="warning"></p>
      <p id="head-notice4" class="warning"></p>
      <p id="head-notice5" class="info"></p>
    </section>

    <!-- Order info -->
    <section class="card section">
      <h3 id="order-sectionTitle" class="order-title"></h3>
      <div class="order-card" role="group" aria-label="Order Details">
        <div class="info-row">
          <div id="order-orderIdLabel" class="info-label"></div>
          <div id="orderId" class="info-value"></div>
          <button class="copy-button" data-copy-target="#orderId" aria-label="Copy Order ID" title="複製">
            <span class="copy-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 8V6C8 4.89543 8.89543 4 10 4H18C19.1046 4 20 4.89543 20 6V14C20 15.1046 19.1046 16 18 16H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M6 8H14C15.1046 8 16 8.89543 16 10V18C16 19.1046 15.1046 20 14 20H6C4.89543 20 4 19.1046 4 18V10C4 8.89543 4.89543 8 6 8Z" stroke="currentColor" stroke-width="2"/>
              </svg>
            </span>
          </button>
        </div>
        <div id="amount-info" class="info-row">
          <div id="order-orderAmountLabel" class="info-label"></div>
          <div id="orderAmount" class="info-value"> </div>
          <button class="copy-button" data-copy-target="#orderAmount" aria-label="Copy Order Amount" title="複製">
            <span class="copy-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 8V6C8 4.89543 8.89543 4 10 4H18C19.1046 4 20 4.89543 20 6V14C20 15.1046 19.1046 16 18 16H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M6 8H14C15.1046 8 16 8.89543 16 10V18C16 19.1046 15.1046 20 14 20H6C4.89543 20 4 19.1046 4 18V10C4 8.89543 4.89543 8 6 8Z" stroke="currentColor" stroke-width="2"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </section>

    <!-- Form -->
    <section id="payerSection" class="card section" style="padding-top: 0;">
      <form id="payerForm">
        <div class="order-card" style="padding: 14px; margin-bottom: 12px;">
          <div class="field">
            <label id="form-bankNameLabel" for="bankName"> <span class="required">*</span></label>
            <input id="bankName" name="bankName" type="text" placeholder="" autocomplete="off" />
            <p id="errBankName" class="error-text" style="display:none;"></p>
          </div>

          <div class="field">
            <label id="form-accountNumberLabel" for="accountNumber"> <span class="required">*</span></label>
            <input id="accountNumber" name="accountNumber" type="text" inputmode="numeric" placeholder="" autocomplete="off" />
            <p id="errAccountNumber" class="error-text" style="display:none;"></p>
          </div>

          <div class="field" style="margin-bottom: 0;">
            <label id="form-payerNameLabel" for="payerName"> <span class="required">*</span></label>
            <input id="payerName" name="payerName" type="text" placeholder="" autocomplete="off" />
            <p id="errPayerName" class="error-text" style="display:none;"></p>
          </div>

          <p id="form-helper" class="helper"></p>
        </div>

        <button id="submitBtn" class="primary-btn" type="submit">
          <span id="submitSpinner" style="display:none;" aria-hidden="true">
            <svg class="spinner" style="width:18px;height:18px;" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" />
              <path d="M22 12a10 10 0 0 1-10 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
            </svg>
          </span>
          <span id="submitText"></span>
        </button>
      </form>
    </section>
  </main>

  <div class="container">
    <footer class="payment-footer">
      <h4 id="foot-notice0"></h4>
      <ul>
        <li id="foot-notice1"></li>
        <li id="foot-notice2"></li>
        <li id="foot-notice3"></li>
        <li id="foot-notice4"></li>
      </ul>
    </footer>
  </div>
  <script src="/register/main.js"></script>
</body>
</html>
