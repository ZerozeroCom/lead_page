<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>密碼頁</title>
<style>
body { font-family: sans-serif; text-align: center; margin-top: 50px; }
#mainContent { display: none; }
</style>
</head>
<body>

<h1>請輸入密碼</h1>
<input type="password" id="pwdInput" placeholder="輸入密碼">
<button id="enterBtn">進入</button>

<div id="mainContent"></div>

<script>

const PASSWORD = "ff804467aea395c049d5c2bdca6373dc87ed3afa20259938b097972c182cca0b"; 

document.getElementById("enterBtn").addEventListener("click",async  ()=>{
    const input = document.getElementById("pwdInput").value;

    // 驗證密碼
    let str = await sha256(input);
    console.log(str,PASSWORD)
    if( str == PASSWORD){
         console.log(123)
        loadSite(input);
    } else {
        alert("密碼錯誤");
    }
});

async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// 延遲載入網站
function loadSite(folder){
    // 取得真正網站的 index.html
    window.location.href = `${folder}/index.html`;
}
</script>

</body>
</html>
