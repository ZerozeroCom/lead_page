
<!doctype html>
<html lang="zh-TW">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />

		<!-- SEO (editable via PAGE_DATA) -->
		<title id="meta-title">單頁骨架範例</title>
		<meta id="meta-description" name="description" content="單頁骨架（僅結構與圖片 CSS）" />
		<meta name="keywords" content="單頁,骨架,RWD,SEO" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://example.com/" id="meta-canonical" />

		<!-- Open Graph / Twitter (ids updated by main.js) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="" id="og-title" />
		<meta property="og:description" content="" id="og-description" />
		<meta property="og:url" content="" id="og-url" />
		<meta property="og:image" content="" id="og-image" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="" id="twitter-title" />
		<meta name="twitter:description" content="" id="twitter-description" />
		<meta name="twitter:image" content="" id="twitter-image" />

		<link rel="stylesheet" href="/main.css" />

		<!-- JSON-LD placeholder (populated by main.js) -->
		<script type="application/ld+json" id="ld-json">{}</script>
	</head>
	<body>
		<!-- Skeleton derived from raw.mhtml (text removed; images not loaded) -->
		<div class="app">
			<section id="p1" class="p1 page">
				<a class="akaerocore-logo" id="akaerocore-logo" href="#" aria-hidden="true"></a>
				<div class="p1-container">
					<div class="p1-slogan pc-img image-placeholder" aria-hidden="true"></div>
					<div class="p1-slogan m-img image-placeholder" aria-hidden="true"></div>
					<div class="p1-btn-container">
						<div class="p1-steam-btn">
							<a class="target-element btn-placeholder" href="#" aria-hidden="true"></a>
							<a class="target-element btn-placeholder" href="#" aria-hidden="true"></a>
						</div>
						<div class="p1-dlsite-btn">
							<a class="target-element btn-placeholder" href="#" aria-hidden="true"></a>
						</div>
					</div>
				</div>
			</section>

			<section id="p2" class="p2 page">
				<div class="p2-container">
					<div class="p2-content">
						<div class="p2-content-container">
							<div class="p2-slogan pc-img image-placeholder" aria-hidden="true"></div>
							<div class="p2-slogan m-img image-placeholder" aria-hidden="true"></div>
							<div class="p2-text image-placeholder" aria-hidden="true"></div>
						</div>
						<div class="p2-video">
							<div class="p2-video-container">
								<video autoplay muted loop playsinline class="video-placeholder" aria-hidden="true"></video>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section id="p3" class="p3 page">
				<div class="p3-container">
					<div class="p3-slogan pc-img image-placeholder" aria-hidden="true"></div>
					<div class="p3-board">
						<div class="p3-board-container">
							<div class="note pc-img image-placeholder" aria-hidden="true"></div>
						</div>
						<div class="p3-board-bg pc-img image-placeholder" aria-hidden="true"></div>
					</div>
				</div>
			</section>

			<section id="p4" class="p4 page">
				<div class="p4-container">
					<div class="chara-container">
						<div class="chara-tab">
							<ul>
								<li id="c-tab-1" class="active"><a href="#c-1"><span class="pc-img image-placeholder"></span><span class="m-img image-placeholder"></span></a></li>
								<li id="c-tab-2"><a href="#c-2"><span class="pc-img image-placeholder"></span><span class="m-img image-placeholder"></span></a></li>
								<li id="c-tab-3"><a href="#c-3"><span class="pc-img image-placeholder"></span><span class="m-img image-placeholder"></span></a></li>
								<li id="c-tab-4"><a href="#c-4"><span class="pc-img image-placeholder"></span><span class="m-img image-placeholder"></span></a></li>
							</ul>
						</div>
						<div class="chara-content">
							<div id="c-1" class="chara-box" style="display:block">
								<div class="chara-box-container">
									<div class="chara-left">
										<div class="c-name image-placeholder pc-img" aria-hidden="true"></div>
									</div>
									<div class="chara-right">
										<div class="chara-img image-placeholder" aria-hidden="true"></div>
									</div>
								</div>
							</div>
							<div id="c-2" class="chara-box" style="display:none"></div>
							<div id="c-3" class="chara-box" style="display:none"></div>
							<div id="c-4" class="chara-box" style="display:none"></div>
						</div>
					</div>
				</div>
			</section>

			<section id="p5" class="p5 page">
				<div class="p5-container">
					<div class="product-container">
						<div class="pr-img image-placeholder pc-img" aria-hidden="true"></div>
						<div class="product-content">
							<div class="product-info image-placeholder" aria-hidden="true"></div>
						</div>
					</div>
				</div>
			</section>
		</div>

		<footer class="site-footer">
			<div class="container">
				<p id="footer-text">© 你的品牌</p>
			</div>
		</footer>

		<!-- main.js: contains PAGE_DATA, applyPageData(renderer) and utilities -->
		<script src="/main.js" defer></script>
	</body>
</html>
