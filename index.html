<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>密碼頁</title>
<style>
body { font-family: sans-serif; text-align: center; margin-top: 50px; }
#mainContent { display: none; }
</style>
</head>
<body>

<h1>請輸入密碼</h1>
<input type="password" id="pwdInput" placeholder="輸入密碼">
<button id="enterBtn">進入</button>

<div id="mainContent"></div>

<script>

const PASSWORD1 = "ca8626e735684207ea5c17e9868beccc1808ac60d8c70b06c8c4766227180422"; 
const PASSWORD2 = "246c042d8fb9be883ef7195bd5aa0b5c167002f4ab731bd89f64e032acecaa10"; 

document.getElementById("enterBtn").addEventListener("click",async  ()=>{
    const input = document.getElementById("pwdInput").value;

    // 驗證密碼
    let str = await sha256(input);
    if( str == PASSWORD1 || str ==PASSWORD2){
         console.log(123)
        loadSite(input);
    } else {
        alert("密碼錯誤");
    }
});

async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// 延遲載入網站
function loadSite(folder){
    // 取得真正網站的 index.html
    window.location.href = `${folder}/index.html`;
}
</script>

</body>
</html>
